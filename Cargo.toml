[package]
name = "agent-context-cli"
version = "0.1.0"
edition = "2024"
description = "Deterministic task-specific context router for coding agents"
license = "MIT"
repository = "https://github.com/AmirTlinov/ctx"
readme = "README.md"
keywords = ["ai", "agents", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE",
  "/README.md",
  "/docs/**",
  "/npm/agent-context-cli/package.json",
  "/npm/agent-context-cli/bin/ctx",
  "/npm/agent-context-cli/scripts/install.js",
  "/npm/agent-context-cli/README.md",
  "/npm/agent-context-cli/LICENSE",
  "/schemas/**",
  "/scripts/**",
  "/src/**",
  "/fixtures/**",
  "/tests/**",
]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
dirs = "6.0.0"
ignore = "0.4.25"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yml = "0.0.12"
sha2 = "0.10.9"

[dev-dependencies]
jsonschema = { version = "0.46.2", default-features = false }
tempfile = "3.23.0"

[[bin]]
name = "ctx"
path = "src/main.rs"
