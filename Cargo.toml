[package]
name = "codemap"
version = "0.2.86"
edition = "2024"
description = "Structural code map CLI for coding agents"
license = "MIT"
repository = "https://github.com/AmirTlinov/codemap"
readme = "README.md"
keywords = ["ai", "agents", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/build.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/docs/**",
  "/schemas/**",
  "/src/**",
]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
dirs = "6.0.0"
globset = "0.4.18"
ignore = "0.4.25"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
yaml_serde = "0.10.4"
sha2 = "0.10.9"
toml = "1.1.2"
clap_complete = "4.5"

[dev-dependencies]
jsonschema = { version = "0.46.2", default-features = false }
tempfile = "3.23.0"

[[bin]]
name = "codemap"
path = "src/main.rs"
