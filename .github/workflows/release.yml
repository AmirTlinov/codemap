name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Require tag to match Cargo version on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          pkgid="$(cargo pkgid --quiet)"
          version="${pkgid##*@}"
          test "$TAG" = "v$version"
          tag_commit="$(git rev-list -n 1 "$TAG")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Run release check
        run: ./scripts/release-check.sh

  build-assets:
    name: build assets (${{ matrix.os }})
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version
          cargo --version

      - name: Build release archive
        run: ./scripts/package-release.sh --target "${{ matrix.target }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ctx-release-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: publish release
    needs: build-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: ctx-release-*
          path: release-assets
          merge-multiple: true

      - name: Build npm package asset
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CTX_EXPECTED_VERSION="${TAG#v}" ./scripts/package-npm-wrapper.sh --out-dir release-assets

      - name: Verify expected assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          find release-assets -maxdepth 1 -type f -print | sort
          cat > expected-assets.txt <<EOF
          agent-context-cli-${version}.tgz
          ctx-${TAG}-aarch64-apple-darwin.tar.gz
          ctx-${TAG}-aarch64-apple-darwin.tar.gz.sha256
          ctx-${TAG}-x86_64-unknown-linux-gnu.tar.gz
          ctx-${TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256
          EOF
          find release-assets -maxdepth 1 -type f -exec basename {} \; | sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          mapfile -t archives < <(find release-assets -maxdepth 1 -type f -name "ctx-${TAG}-*.tar.gz" | sort)
          mapfile -t checksums < <(find release-assets -maxdepth 1 -type f -name "ctx-${TAG}-*.tar.gz.sha256" | sort)
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" -eq 5
          test "${#archives[@]}" -eq 2
          test "${#checksums[@]}" -eq 2
          test -f "release-assets/agent-context-cli-${version}.tgz"
          for archive in "${archives[@]}"; do
            test -f "${archive}.sha256"
            grep -F "  $(basename "$archive")" "${archive}.sha256" >/dev/null
          done
          ./scripts/generate-homebrew-formula.sh \
            --release-dir release-assets \
            --tag "$TAG" \
            --output release-assets/ctx.rb
          ruby -c release-assets/ctx.rb

      - name: Create draft release, verify assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists: $TAG" >&2
            exit 1
          fi

          created=0
          published=0
          cleanup_draft() {
            if [[ "$created" = 1 && "$published" = 0 ]]; then
              gh release delete "$TAG" --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_draft EXIT

          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes "Automated ctx release for $TAG."
          created=1
          gh release upload "$TAG" release-assets/*

          tmpdir="$(mktemp -d)"
          find release-assets -maxdepth 1 -type f -exec basename {} \; | sort > "$tmpdir/expected-assets.txt"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > "$tmpdir/actual-assets.txt"
          diff -u "$tmpdir/expected-assets.txt" "$tmpdir/actual-assets.txt"
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true"

          gh release edit "$TAG" --draft=false --verify-tag
          published=1
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "false"
